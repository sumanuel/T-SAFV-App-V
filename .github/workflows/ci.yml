name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint -- --quiet

      - name: Formato
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Bundle de Android
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export-check"
